<!DOCTYPE html>
<html lang="en">
<head>
    <title>Vigenere Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; }
        .navbar-custom { background-color: #0a4275; padding: 15px 0;}
        .navbar-custom .navbar-brand { color: white; font-weight: 700; letter-spacing: 1px;}
        .student-nav { color: #d1e5f5; font-size: 0.9rem; font-weight: 400;}
        .page-header { margin: 40px 0 30px; color: #0a4275; font-weight: 800; text-align: center; font-size: 2rem;}
        .card { border: none; border-radius: 16px; box-shadow: 0 5px 20px rgba(0,0,0,0.04); transition: transform 0.2s;}
        .card:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        .card-header { background-color: white; border-bottom: 2px solid #f4f7f6; font-weight: 800; font-size: 1.1rem; border-radius: 16px 16px 0 0 !important; padding: 20px;}
        .encrypt-header { color: #00b894; } 
        .decrypt-header { color: #d63031; } 
        .btn-custom { border-radius: 10px; font-weight: 600; padding: 12px; font-size: 1.05rem; letter-spacing: 0.5px;}
        .form-control { border-radius: 10px; border: 1.5px solid #dfe6e9; padding: 12px; background-color: #fafbfc;}
        .form-control:focus { box-shadow: 0 0 0 0.2rem rgba(10, 66, 117, 0.1); border-color: #0a4275; background-color: #fff;}
        .guideline { font-size: 0.85rem; color: #636e72; margin-bottom: 8px;}
    </style>
</head>
<body>
    <nav class="navbar navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/">🏠 TRANG CHỦ</a>
            <span class="student-nav">Nguyễn Đăng Khoa | 2380601064</span>
        </div>
    </nav>

    <div class="container">
        <h2 class="page-header">VIGENERE CIPHER</h2>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header encrypt-header">🔓 MÃ HÓA (ENCRYPTION)</div>
                    <div class="card-body p-4">
                        <form method="POST" action="/vigenere/encrypt">
                            <div class="form-group mb-4">
                                <label class="font-weight-bold text-dark">Plain text (Bản rõ):</label>
                                <input type="text" class="form-control" name="inputPlainText" placeholder="Nhập văn bản cần mã hóa..." required autofocus/>
                            </div>
                            <div class="form-group mb-4">
                                <label class="font-weight-bold text-dark">Key (Khóa):</label>
                                <div class="guideline">📍 Bắt buộc: CHỮ CÁI, tuyệt đối không chứa số hay khoảng trắng.</div>
                                <input type="text" class="form-control" name="inputKeyPlain" pattern="[A-Za-z]+" title="Chỉ nhập chữ cái, không khoảng trắng, không số" placeholder="Ví dụ: HUTECH" required/>
                            </div>
                            <button type="submit" class="btn btn-success btn-custom w-100 mt-2" style="background-color: #00b894; border: none;">Tiến hành Mã hóa</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header decrypt-header">🔒 GIẢI MÃ (DECRYPTION)</div>
                    <div class="card-body p-4">
                        <form method="POST" action="/vigenere/decrypt">
                            <div class="form-group mb-4">
                                <label class="font-weight-bold text-dark">Cipher text (Bản mã):</label>
                                <input type="text" class="form-control" name="inputCipherText" placeholder="Nhập bản mã cần giải mã..." required/>
                            </div>
                            <div class="form-group mb-4">
                                <label class="font-weight-bold text-dark">Key (Khóa):</label>
                                <div class="guideline">📍 Bắt buộc: CHỮ CÁI, tuyệt đối không chứa số hay khoảng trắng.</div>
                                <input type="text" class="form-control" name="inputKeyPlain" pattern="[A-Za-z]+" title="Chỉ nhập chữ cái, không khoảng trắng, không số" placeholder="Ví dụ: HUTECH" required/>
                            </div>
                            <button type="submit" class="btn btn-danger btn-custom w-100 mt-2" style="background-color: #d63031; border: none;">Tiến hành Giải mã</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
